<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Crypto | Kaastro Pay</title>
<meta name="theme-color" content="#10b981">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<script src="../js/boot.js" data-root="../"></script>
</head>
<body data-portal="user" data-page="buy" data-title="Buy crypto" data-sub="Spend your cash balance and receive crypto instantly">

<main class="main-content">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-xl-5">
      <div id="ticket"></div>
      <div class="card p-3 mt-3">
        <h2 class="card-title mb-2">How this works</h2>
        <div id="explain" class="small text-muted"></div>
      </div>
    </div>
  </div>
</main>

<script src="../js/trade.js"></script>
<script>
KP.ready(function () {
  KP.trade.mount($('#ticket'), 'buy');
  $('#explain').html(KP_EXPLAIN['buy']);
});
var KP_EXPLAIN = {
  buy: '<p class="mb-2">Your cash balance is debited and the crypto lands in your Kaastro wallet immediately — no blockchain wait, because the coins never leave our custody.</p><p class="mb-0">The rate you see is our buy rate: mid-market plus our spread. It is locked for 30 seconds once you confirm.</p>',
  sell: '<p class="mb-2">Crypto leaves your wallet and your cash balance is credited at the sell rate. Withdrawing that cash to your bank is a separate step.</p><p class="mb-0">The rate is pinned when you confirm, so a market move between confirming and settling does not change what you receive.</p>',
  swap: '<p class="mb-2">Swaps move between two assets you already hold. Both legs are internal, so there is no network fee and nothing to confirm on-chain.</p><p class="mb-0">Our swap spread is lower than buy or sell because there is no fiat rail involved.</p>'
};
</script>
</body>
</html>
