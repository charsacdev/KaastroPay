<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | Kaastro Pay</title>
<meta name="theme-color" content="#10b981">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaastro Pay">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<script>(function(){try{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('kaastro-theme')||'light');}catch(e){}})();</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="css/kaastro.css">
<link rel="stylesheet" href="css/public.css">
</head>
<body>

<div class="auth-wrap"><div class="auth-card">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <a href="index.html" class="brand-logo ps-0">
      <img src="images/logo.png" alt="Kaastro Pay" class="brand-img">
    </a>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
  </div>
  <h1>Welcome back</h1>
  <p class="sub mb-4">Log in to your Kaastro Pay account.</p>

  <label class="form-label">Email or phone</label>
  <input class="form-control mb-3" value="chukwudi.okeke@gmail.com">

  <label class="form-label">Password</label>
  <div class="input-group mb-2">
    <input type="password" class="form-control" value="demo-password">
    <button class="btn btn-soft pw-toggle" type="button"><i class="fas fa-eye"></i></button>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="form-check"><input class="form-check-input" type="checkbox" id="rem" checked>
      <label class="form-check-label" for="rem" style="font-size:.82rem">Keep me signed in</label></div>
    <a href="forgot-password.html" class="text-primary-k fw-bold" style="font-size:.82rem">Forgot password?</a>
  </div>

  <a href="dashboard/index.html" class="btn btn-primary w-100">Log in</a>

  <p class="text-center mt-3 mb-0" style="font-size:.85rem">
    New here? <a href="register.html" class="text-primary-k fw-bold">Create an account</a></p>

  <div class="k-alert k-info mt-4">
    <i class="fas fa-circle-info"></i>
    <div><b>Prototype.</b>Any credentials work. The transaction PIN is <b>1234</b>.</div>
  </div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/rates-engine.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/rails.js"></script>
<script src="js/pwa.js"></script>
<script>
$(function () {
  $('#themeBtn').on('click', function () {
    KP.rails.theme.apply(KP.rails.theme.current() === 'dark' ? 'light' : 'dark');
  });
  $('.pw-toggle').on('click', function () {
    var $i = $(this).closest('.input-group').find('input');
    var t = $i.attr('type') === 'password' ? 'text' : 'password';
    $i.attr('type', t);
    $(this).find('i').attr('class', t === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash');
  });

});
</script>
</body>
</html>
