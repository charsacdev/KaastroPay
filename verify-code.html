<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm your email | Kaastro Pay</title>
<meta name="theme-color" content="#10b981">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<script>(function(){try{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('kaastro-theme')||'light');}catch(e){}})();</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="css/kaastro.css">
<link rel="stylesheet" href="css/public.css">
</head>
<body>

<div class="auth-wrap"><div class="auth-card text-center">
  <a href="index.html" class="brand-logo mb-4 justify-content-center"><img src="images/logo.png" alt="Kaastro Pay" class="brand-img"></a>

  <div class="qa-icon qa-green mx-auto mb-3" style="width:54px;height:54px;font-size:1.3rem">
    <i class="fas fa-envelope-open-text"></i></div>

  <h1>Check your email</h1>
  <p class="sub mb-4">We sent a six-digit code to <b id="dest">you@example.com</b>.</p>

  <div class="otp-row mb-3" id="otp">
    <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
    <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
    <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
  </div>

  <button class="btn btn-primary w-100" id="go" disabled>Confirm</button>

  <p class="mt-3 mb-0" style="font-size:.84rem">
    <span class="text-muted">Didn't get it?</span>
    <a href="#" class="text-primary-k fw-bold" id="resend">Resend</a>
    <span class="text-muted" id="timer"></span></p>

  <p class="mt-3 mb-0" style="font-size:.8rem">
    <a href="register.html" class="text-muted"><i class="fas fa-arrow-left me-1"></i>Change email</a></p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/rates-engine.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/rails.js"></script>
<script>
$(function () {
  var $i = $('#otp input');

  $i.on('input', function () {
    var v = $(this).val().replace(/\D/g, '');
    $(this).val(v);
    if (v && $(this).next('input').length) $(this).next('input').focus();
    check();
  });
  $i.on('keydown', function (e) {
    if (e.key === 'Backspace' && !$(this).val() && $(this).prev('input').length) {
      $(this).prev('input').focus();
    }
  });
  $i.on('paste', function (e) {
    var t = (e.originalEvent.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
    e.preventDefault();
    $i.each(function (n) { $(this).val(t[n] || ''); });
    check();
    $i.eq(Math.min(5, t.length)).focus();
  });

  function code() { return $i.map(function () { return $(this).val(); }).get().join(''); }
  function check() { $('#go').prop('disabled', code().length !== 6); }

  $('#go').on('click', function () { location.href = 'verify-identity.html'; });

  var left = 45;
  var t = setInterval(function () {
    left--;
    $('#timer').text(left > 0 ? '· available in ' + left + 's' : '');
    $('#resend').toggleClass('pe-none opacity-50', left > 0);
    if (left <= 0) clearInterval(t);
  }, 1000);
  $('#resend').addClass('pe-none opacity-50');

  $('#resend').on('click', function (e) {
    e.preventDefault();
    KP.rails.toast('New code sent.');
  });

  $i.eq(0).focus();
});
</script>
</body>
</html>
