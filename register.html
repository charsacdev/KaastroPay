<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account | Kaastro Pay</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<script>(function(){try{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('kaastro-theme')||document.documentElement.getAttribute('data-theme-default')||'dark');}catch(e){}})();</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="css/kaastro.css">
<link rel="stylesheet" href="css/public.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="brand-logo mb-3 justify-content-center">
      <img src="images/logo-onDark.png" alt="Kaastro Pay" class="brand-img">
    </a>

    <!-- Three steps, and the stepper is the only place progress is stated,
         so it stays put while the panel under it changes. -->
    <div class="auth-steps" id="steps"></div>

    <div id="panel"></div>

    <p class="text-center text-muted mt-3 mb-0" style="font-size:.78rem" id="foot"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/rails.js"></script>
<script>
$(function () {
  var STEPS = ['Personal Details', 'Verification', 'PIN'];
  var at = 1;
  var form = { name: '', phone: '', email: '', ref: '', dial: '+234', country: 'NG' };
  var pin = '', pinConfirm = '', entering = 'pin';

  function paintSteps() {
    $('#steps').html(STEPS.map(function (s, i) {
      var n = i + 1;
      return (i ? '<span class="as-line"></span>' : '')
        + '<span class="as-step ' + (n === at ? 'on' : n < at ? 'done' : '') + '">'
        + '<span class="n">' + (n < at ? '<i class="fas fa-check"></i>' : n) + '</span>'
        + '<span class="l">' + s + '</span></span>';
    }).join(''));
  }

  /* ------------------------- 1. personal details ------------------------- */

  function stepDetails() {
    $('#panel').html(
      '<h1 class="text-center">Create your account</h1>'
      + '<p class="sub text-center mb-4">Your country sets your currency. It stays with the account.</p>'

      + '<label class="form-label">Full name</label>'
      + '<div class="input-group mb-3"><span class="input-group-text"><i class="fas fa-user"></i></span>'
      + '<input class="form-control" id="fName" placeholder="Enter your full name" value="' + form.name + '"></div>'

      + '<label class="form-label">Phone number</label>'
      + '<div class="input-group mb-3">'
      + '<select class="form-select flex-grow-0" id="fDial" style="max-width:120px">'
      + KP.COUNTRY_LIST.map(function (c) {
          return '<option value="' + c.code + '|' + c.dial + '"'
            + (c.code === form.country ? ' selected' : '') + '>'
            + c.flag + ' ' + c.dial + '</option>';
        }).join('') + '</select>'
      + '<input class="form-control" id="fPhone" placeholder="Enter your phone number" value="' + form.phone + '"></div>'

      + '<label class="form-label">Email address</label>'
      + '<div class="input-group mb-3"><span class="input-group-text"><i class="fas fa-envelope"></i></span>'
      + '<input type="email" class="form-control" id="fEmail" placeholder="Enter your email address" value="' + form.email + '"></div>'

      + '<label class="form-label">Referral code <span class="text-muted">(optional)</span></label>'
      + '<div class="input-group mb-3"><span class="input-group-text"><i class="fas fa-gift"></i></span>'
      + '<input class="form-control" id="fRef" placeholder="Enter referral code" value="' + form.ref + '"></div>'

      + '<div class="k-alert k-info mb-3" id="ccyNote"></div>'

      + '<div class="form-check mb-3">'
      + '<input class="form-check-input" type="checkbox" id="fTerms">'
      + '<label class="form-check-label" for="fTerms" style="font-size:.82rem">'
      + 'I agree to the <a href="terms.html" class="text-primary-k">Terms</a> and '
      + '<a href="privacy.html" class="text-primary-k">Privacy Policy</a>.</label></div>'

      + '<button class="btn btn-primary w-100" id="toVerify">Continue</button>'
    );
    ccyNote();
    $('#foot').html('Already have an account? <a href="login.html" class="text-primary-k fw-bold">Log in</a>'
      + '<br><i class="fas fa-shield-halved me-1"></i>Your information is encrypted and protected.');
  }

  function ccyNote() {
    var c = KP.COUNTRIES[form.country];
    if (!c) return;
    $('#ccyNote').html('<i class="fas fa-circle-info"></i><div>'
      + 'You will hold and be paid in <b>' + c.currency + '</b>. '
      + 'Crypto you receive converts to ' + c.currency + ' automatically.</div>');
  }

  /* --------------------------- 2. verification --------------------------- */

  var seconds = 42, timer = null;

  function stepVerify() {
    clearInterval(timer);
    $('#panel').html(
      '<div class="auth-art"><i class="fas fa-shield-halved"></i>'
      + '<span class="art-ok"><i class="fas fa-check"></i></span></div>'
      + '<h1 class="text-center">Verify your phone</h1>'
      + '<p class="sub text-center mb-4">Enter the 6-digit code sent to<br>'
      + '<b class="text-main">' + form.dial + ' ' + (form.phone || '••• ••• ••••') + '</b></p>'

      + '<div class="otp-row mb-3" id="otp">'
      + [0,1,2,3,4,5].map(function (i) {
          return '<input class="otp-box" inputmode="numeric" maxlength="1" data-i="' + i + '">';
        }).join('') + '</div>'

      + '<p class="text-center mb-3" style="font-size:.82rem">'
      + '<span class="text-muted">Resend code in </span><b id="cd">0:42</b>'
      + '<a href="#" class="text-primary-k fw-bold d-none" id="resend">Resend code</a></p>'

      + '<button class="btn btn-primary w-100 mb-2" id="toPin">Verify &amp; continue</button>'
      + '<button class="btn btn-soft w-100" id="backDetails">'
      + '<i class="fas fa-arrow-left me-1"></i>Change phone number</button>'
    );
    $('#foot').html('<i class="fas fa-lock me-1"></i>Never share your verification code.');

    seconds = 42;
    timer = setInterval(function () {
      seconds--;
      $('#cd').text('0:' + (seconds < 10 ? '0' : '') + seconds);
      if (seconds <= 0) {
        clearInterval(timer);
        $('#cd').addClass('d-none');
        $('#resend').removeClass('d-none');
      }
    }, 1000);

    $('#otp .otp-box').first().trigger('focus');
  }

  /* Move forward on entry, backward on delete — otherwise a six-box code is
     more fiddly than a single field would have been. */
  $(document).on('input', '.otp-box', function () {
    var v = this.value.replace(/\D/g, '');
    this.value = v.slice(0, 1);
    if (v) $(this).next('.otp-box').trigger('focus');
  });
  $(document).on('keydown', '.otp-box', function (e) {
    if (e.key === 'Backspace' && !this.value) $(this).prev('.otp-box').trigger('focus');
  });
  $(document).on('paste', '.otp-box', function (e) {
    var t = (e.originalEvent.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
    if (!t) return;
    e.preventDefault();
    $('.otp-box').each(function (i) { this.value = t[i] || ''; });
    $('.otp-box').eq(Math.min(5, t.length - 1)).trigger('focus');
  });

  /* ------------------------------- 3. PIN ------------------------------- */

  function stepPin() {
    clearInterval(timer);
    $('#panel').html(
      '<div class="auth-art"><i class="fas fa-lock"></i>'
      + '<span class="art-ok"><i class="fas fa-check"></i></span></div>'
      + '<h1 class="text-center">Set a secure 4-digit PIN</h1>'
      + '<p class="sub text-center mb-4">You will use this to approve every transaction.</p>'

      + '<div class="pin-group mb-3">'
      + '<div class="pin-label">Enter PIN</div>'
      + '<div class="pin-dots" id="dots1"></div></div>'

      + '<div class="pin-group mb-3">'
      + '<div class="pin-label">Confirm PIN</div>'
      + '<div class="pin-dots" id="dots2"></div></div>'

      + '<div class="pin-rules mb-3">'
      + [['Avoid repeated numbers', function () { return !/(\d)\1{3}/.test(pin); }],
         ['Do not use your birth year', function () { return !/^(19|20)\d\d$/.test(pin); }],
         ['Keep your PIN private', function () { return true; }]]
          .map(function (r, i) {
            return '<div class="pin-rule" data-r="' + i + '">'
              + '<i class="fas fa-circle-check"></i><span>' + r[0] + '</span></div>';
          }).join('') + '</div>'

      + '<div class="asset-row mb-3">'
      + '<div class="qa-icon qa-green sm"><i class="fas fa-fingerprint"></i></div>'
      + '<div class="flex-grow-1 min-w-0"><div class="ar-name">Enable fingerprint or Face ID</div>'
      + '<div class="ar-sub">Approve without typing your PIN</div></div>'
      + '<div class="form-check form-switch m-0">'
      + '<input class="form-check-input" type="checkbox" id="bio" checked></div></div>'

      + '<div class="keypad" id="pad">'
      + [1,2,3,4,5,6,7,8,9].map(function (n) { return '<button data-k="' + n + '">' + n + '</button>'; }).join('')
      + '<button data-k="bio" class="k-soft"><i class="fas fa-fingerprint"></i></button>'
      + '<button data-k="0">0</button>'
      + '<button data-k="del" class="k-soft"><i class="fas fa-delete-left"></i></button>'
      + '</div>'

      + '<button class="btn btn-primary w-100 mt-3" id="createPin" disabled>Create PIN</button>'
    );
    $('#foot').html('<i class="fas fa-shield-halved me-1"></i>'
      + 'You will use this PIN to approve transactions.');
    paintPin();
  }

  function paintPin() {
    function dots(v, active) {
      return [0,1,2,3].map(function (i) {
        return '<span class="pin-dot' + (i < v.length ? ' filled' : '')
          + (active && i === v.length ? ' next' : '') + '"></span>';
      }).join('');
    }
    $('#dots1').html(dots(pin, entering === 'pin'));
    $('#dots2').html(dots(pinConfirm, entering === 'confirm'));

    var rules = [!/(\d)\1{3}/.test(pin), !/^(19|20)\d\d$/.test(pin), true];
    $('.pin-rule').each(function (i) {
      $(this).toggleClass('bad', pin.length === 4 && !rules[i]);
    });

    var ok = pin.length === 4 && pinConfirm.length === 4 && rules[0] && rules[1];
    $('#createPin').prop('disabled', !ok || pin !== pinConfirm);
    if (pin.length === 4 && pinConfirm.length === 4 && pin !== pinConfirm) {
      $('#dots2').addClass('mismatch');
    } else {
      $('#dots2').removeClass('mismatch');
    }
  }

  $(document).on('click', '#pad button', function () {
    var k = String($(this).data('k'));
    if (k === 'del') {
      if (entering === 'confirm' && pinConfirm.length) pinConfirm = pinConfirm.slice(0, -1);
      else { entering = 'pin'; pin = pin.slice(0, -1); }
    } else if (k === 'bio') {
      KP.rails.toast('Biometric setup happens on the device.');
      return;
    } else {
      if (pin.length < 4) { entering = 'pin'; pin += k; }
      else if (pinConfirm.length < 4) { entering = 'confirm'; pinConfirm += k; }
      if (pin.length === 4 && pinConfirm.length === 0) entering = 'confirm';
    }
    paintPin();
  });

  /* ------------------------------- wiring ------------------------------- */

  $(document).on('change', '#fDial', function () {
    var p = $(this).val().split('|');
    form.country = p[0]; form.dial = p[1];
    try { KP.setCountry(p[0]); } catch (e) {}
    ccyNote();
  });

  $(document).on('click', '#toVerify', function () {
    form.name = ($('#fName').val() || '').trim();
    form.phone = ($('#fPhone').val() || '').trim();
    form.email = ($('#fEmail').val() || '').trim();
    form.ref = ($('#fRef').val() || '').trim();

    if (!form.name) { KP.rails.toast('Enter your full name.', 'danger'); return; }
    if (!form.phone) { KP.rails.toast('Enter your phone number.', 'danger'); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(form.email)) {
      KP.rails.toast('Enter a valid email address.', 'danger'); return;
    }
    if (!$('#fTerms').is(':checked')) {
      KP.rails.toast('Accept the terms to continue.', 'danger'); return;
    }
    at = 2; paintSteps(); stepVerify();
  });

  $(document).on('click', '#backDetails', function () { at = 1; paintSteps(); stepDetails(); });

  $(document).on('click', '#toPin', function () {
    var code = $('.otp-box').map(function () { return this.value; }).get().join('');
    if (code.length < 6) { KP.rails.toast('Enter the 6-digit code.', 'danger'); return; }
    at = 3; paintSteps(); stepPin();
  });

  $(document).on('click', '#resend', function (e) {
    e.preventDefault();
    KP.rails.toast('A new code is on its way.');
    stepVerify();
  });

  $(document).on('click', '#createPin', function () {
    KP.rails.toast('Account created. Welcome to Kaastro Pay.');
    setTimeout(function () { location.href = 'dashboard/index.html'; }, 900);
  });

  paintSteps();
  stepDetails();
});
</script>
</body>
</html>
